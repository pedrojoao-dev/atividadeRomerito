{% extends "base.html" %}

{%block conteudo%}

    <ul class="card">
        <a href="{{url_for('livro', livro_id=i['id'])}}"><li>{{i['titulo']}}</li></a>
        <li>{{i['autor']}}</li>

        <li>{{i['genero']}}</li>

    </ul>

{% endfor %}
{%endblock%}
